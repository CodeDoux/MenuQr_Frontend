<div class="page-header">
  <div class="pl-header-title">
    <span class="pl-header-icon">👥</span>
    <div>
      <h1 class="page-title">Administrateurs</h1>
      <p class="page-subtitle">Comptes ayant accès à l'espace d'administration MenuQr.</p>
    </div>
  </div>
  <button type="button" class="btn btn--primary" (click)="ouvrirCreation()">
    <span class="mn-btn-icon">+</span> Nouvel administrateur
  </button>
</div>

@if (comptes().length === 0) {
  <div class="card empty-state mn-empty">
    <div class="mn-empty-icon">🛡️</div>
    <div class="empty-state-title">Aucun compte administrateur</div>
  </div>
} @else {
  <div class="emp-list">
    @for (c of comptes(); track c.id) {
      <div class="card emp-row" [class.emp-row--invite]="!c.actif">
        <div class="emp-avatar adm-avatar">{{ c.nom_complet.charAt(0).toUpperCase() }}</div>

        <div class="emp-info">
          <div class="emp-nom">{{ c.nom_complet }}</div>
          <div class="emp-email">{{ c.email }}</div>
          <app-badge [label]="c.actif ? 'Actif' : 'Désactivé'" [tone]="c.actif ? 'success' : 'neutral'" />
        </div>

        <div class="emp-actions">
          <button type="button" class="adm-action-chip" [class.adm-action-chip--success]="!c.actif" [class.adm-action-chip--warning]="c.actif" (click)="basculerActif(c.id)">
            {{ c.actif ? '⏸ Désactiver' : '✓ Réactiver' }}
          </button>
          <button type="button" class="mn-action-btn mn-action-btn--delete" title="Supprimer" (click)="supprimer(c.id, c.nomComplet)">🗑</button>
        </div>
      </div>
    }
  </div>
}

<app-modal [ouvert]="formOuvert()" titre="Nouvel administrateur" icone="🛡️" (fermer)="formOuvert.set(false)">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
    <label class="field">
      <span class="field-label">Nom complet *</span>
      <input type="text" formControlName="nomComplet" class="field-input" />
    </label>
    <label class="field">
      <span class="field-label">Email *</span>
      <input type="email" formControlName="email" class="field-input" />
    </label>
    <div class="form-actions">
      <button type="button" class="btn btn--ghost" (click)="formOuvert.set(false)">Annuler</button>
      <button type="submit" class="btn btn--primary">Créer</button>
    </div>
  </form>
</app-modal>
