<div class="login-shell admin-login-shell admin-scope">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark admin-brand-mark">MQ</span>
      <span class="login-brand-name">MenuQr <span class="admin-tag">Admin</span></span>
    </div>
    <h1 class="login-title">🛡️ Espace Administration</h1>
    <p class="login-subtitle">Réservé à l'équipe MenuQr — gestion de la plateforme.</p>

    @if (sessionExpiree) {
  <div class="login-error">⏱️ Ta session a expiré. Reconnecte-toi pour continuer.</div>
}

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" formControlName="email" class="field-input" placeholder="admin@menuqr.com" autocomplete="username" />
        @if (form.get('email')?.touched && form.get('email')?.invalid) {
          <span class="field-error">Email valide requis.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Mot de passe</span>
        <input type="password" formControlName="motDePasse" class="field-input" autocomplete="current-password" />
        @if (form.get('motDePasse')?.touched && form.get('motDePasse')?.invalid) {
          <span class="field-error">Mot de passe requis.</span>
        }
      </label>

      @if (erreur()) {
        <div class="login-error">{{ erreur() }}</div>
      }

      <button type="submit" class="btn btn--primary login-submit" [disabled]="enCours()">
        {{ enCours() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="login-demo">
      <p class="field-hint">Démo : admin&#64;menuqr.com / admin123</p>
    </div>
  </div>
</div>
