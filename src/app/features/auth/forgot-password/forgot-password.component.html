<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">MQ</span>
      <span class="login-brand-name">MenuQr</span>
    </div>
    <h1 class="login-title">Mot de passe oublié</h1>

    @if (!envoye()) {
      <p class="login-subtitle">Entrez votre email, nous vous enverrons un lien de réinitialisation.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" formControlName="email" class="field-input" placeholder="vous@restaurant.sn" />
          @if (form.get('email')?.touched && form.get('email')?.invalid) {
            <span class="field-error">Email valide requis.</span>
          }
        </label>

        <button type="submit" class="btn btn--primary login-submit" [disabled]="enCours()">
          {{ enCours() ? 'Envoi...' : 'Envoyer le lien' }}
        </button>
      </form>
    } @else {
      <p class="login-subtitle">✓ Si un compte existe avec cet email, un lien de réinitialisation a été envoyé (simulation — aucun email réel).</p>
      <a routerLink="/login" class="btn btn--ghost login-submit" style="display:block; text-align:center; text-decoration:none;">Retour à la connexion</a>
    }

    <div class="login-demo">
      <a routerLink="/login" class="field-hint">← Retour à la connexion</a>
    </div>
  </div>
</div>
