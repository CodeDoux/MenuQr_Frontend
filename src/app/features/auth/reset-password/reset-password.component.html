<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">MQ</span>
      <span class="login-brand-name">MenuQr</span>
    </div>
    <h1 class="login-title">Nouveau mot de passe</h1>
    <p class="login-subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <label class="field">
        <span class="field-label">Nouveau mot de passe</span>
        <input type="password" formControlName="nouveauMotDePasse" class="field-input" />
        @if (form.get('nouveauMotDePasse')?.touched && form.get('nouveauMotDePasse')?.invalid) {
          <span class="field-error">8 caractères minimum.</span>
        }
      </label>
      <label class="field">
        <span class="field-label">Confirmation</span>
        <input type="password" formControlName="confirmation" class="field-input" />
      </label>

      @if (erreur()) {
        <div class="login-error">{{ erreur() }}</div>
      }

      <button type="submit" class="btn btn--primary login-submit" [disabled]="enCours()">
        {{ enCours() ? 'Mise à jour...' : 'Réinitialiser le mot de passe' }}
      </button>
    </form>
  </div>
</div>
