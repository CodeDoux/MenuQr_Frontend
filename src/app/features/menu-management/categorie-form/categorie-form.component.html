<app-modal [ouvert]="ouvert" [titre]="titre" (fermer)="fermer.emit()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
    <label class="field">
      <span class="field-label">Nom de la catégorie *</span>
      <input type="text" formControlName="nom" placeholder="Ex. Entrées, Plats, Boissons..." class="field-input" />
      @if (form.get('nom')?.touched && form.get('nom')?.invalid) {
        <span class="field-error">Le nom de la catégorie est requis.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Description</span>
      <textarea formControlName="description" rows="2" class="field-input" placeholder="Optionnel"></textarea>
    </label>

    <label class="field">
      <span class="field-label">Icône</span>
      <input type="text" formControlName="icone" class="field-input" placeholder="Ex. 🥗 ou nom d'icône" maxlength="4" />
      <span class="field-hint">Un emoji simple suffit pour l'instant (ex. 🍽️, 🥤, 🍰).</span>
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field-label">Ordre d'affichage</span>
        <input type="number" formControlName="ordreAffichage" min="1" class="field-input" />
      </label>
      <label class="field field--switch">
        <span class="field-label">Catégorie active</span>
        <input type="checkbox" formControlName="estActive" class="field-switch" />
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn--ghost" (click)="fermer.emit()">Annuler</button>
      <button type="submit" class="btn btn--primary">Enregistrer</button>
    </div>
  </form>
</app-modal>
