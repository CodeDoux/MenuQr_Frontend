<app-modal [ouvert]="ouvert" [titre]="titre" (fermer)="fermer.emit()">
  <div class="qr-panel">
    @if (enCoursGeneration) {
      <div class="qr-loading">Génération du QR code...</div>
    } @else if (qrCode?.image) {
      <img [src]="qrCode!.image" alt="QR Code" class="qr-image" />
      <p class="qr-url">{{ qrCode!.url }}</p>
      <div class="qr-meta">
        <span>{{ qrCode!.nombreScan }} scan(s)</span>
        <span>·</span>
        <span>Créé le {{ qrCode!.createdAt | date: 'dd/MM/yyyy' }}</span>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--ghost" (click)="regenerer.emit()">Régénérer</button>
        <button type="button" class="btn btn--primary" (click)="telecharger()">Télécharger</button>
      </div>
    } @else {
      <div class="qr-loading">Aucun QR code généré pour l'instant.</div>
      <div class="form-actions">
        <button type="button" class="btn btn--primary" (click)="regenerer.emit()">Générer le QR code</button>
      </div>
    }
  </div>
</app-modal>
